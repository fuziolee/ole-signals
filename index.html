<!doctype html>
<html lang="id" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="OLE Signals — marketplace sinyal forex. Trader memposting sinyal, follower menyalin manual di broker masing-masing." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2338BDF8'/%3E%3Cpath d='M7 21l6-7 4 4 8-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>OLE Signals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite">
    <div class="boot-box">
      <div class="logo">OLE <em>Signals</em></div>
      <p class="boot-msg">Memuat OLE Signals&hellip;</p>
      <p class="boot-err" id="boot-error" hidden>Gagal memuat aplikasi &mdash; koneksi ke server mungkin bermasalah. Periksa koneksimu lalu coba lagi.</p>
      <button class="btn primary" id="boot-retry" type="button" hidden>Muat ulang</button>
    </div>
  </div>
  <script>
    document.getElementById('boot-retry').addEventListener('click', function () { location.reload(); });
    setTimeout(function () {
      if (!window.__oleBooted) {
        var e = document.getElementById('boot-error');
        var b = document.getElementById('boot-retry');
        if (e) e.hidden = false;
        if (b) b.hidden = false;
      }
    }, 12000);
  </script>
  <div class="app" id="app" hidden>
    <!-- Sidebar web (Ronde 15 #3): layar lebar ≥900px; di HP pakai bottom nav -->
    <nav class="side-nav" aria-label="Navigasi utama">
      <div class="side-brand"><span class="logo">OLE <em>Signals</em></span></div>
      <button type="button" data-nav="home" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span><span class="lbl" data-i18n="navHome"></span></button>
      <button type="button" data-nav="search" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span><span class="lbl" data-i18n="navSearch"></span></button>
      <button type="button" data-nav="office" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="lbl" data-i18n="navOffice"></span></button>
      <button type="button" data-nav="wallet" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H6"/></svg></span><span class="lbl" data-i18n="navWallet"></span></button>
      <button type="button" data-nav="profile" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="lbl" data-i18n="navProfile"></span></button>
      <button type="button" id="side-logout"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="m16 16.5 5-4.5-5-4.5"/><path d="M21 12H9.5"/></svg></span><span class="lbl" data-i18n="logout"></span></button>
    </nav>

    <main>
      <!-- Beranda -->
      <section class="view" id="view-home" aria-label="Beranda">
        <div id="home-filters"></div>
        <p class="risk-note" data-i18n="riskNote"></p>
        <div id="home-list"></div>
        <section class="roadmap">
          <h2 data-i18n="roadTitle"></h2>
          <ul>
            <li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><b data-i18n="road1T"></b></div></li>
            <li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><b data-i18n="road2T"></b></div></li>
            <li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><b data-i18n="road3T"></b></div></li>
            <li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><b data-i18n="road4T"></b></div></li>
            <li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><b data-i18n="road5T"></b></div></li>
            <li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><div><b data-i18n="road6T"></b></div></li>
          </ul>
        </section>
        <p class="foot" data-i18n-html="riskWarn"></p>
      </section>

      <!-- Cari -->
      <section class="view" id="view-search" aria-label="Cari">
        <h1 data-i18n="searchTitle"></h1>
        <p class="sub" data-i18n="searchSub"></p>
        <div class="tabs" role="tablist" id="search-tabs">
          <button class="tab" role="tab" data-stab="traders" aria-selected="true"><span data-i18n="searchTabTraders"></span></button>
          <button class="tab" role="tab" data-stab="followed" aria-selected="false"><span data-i18n="followed"></span></button>
          <button class="tab" role="tab" data-stab="subs" aria-selected="false"><span data-i18n="officeTraderTabSubs"></span></button>
          <button class="tab" role="tab" data-stab="board" aria-selected="false"><span data-i18n="searchTabBoard"></span></button>
        </div>
        <div id="search-controls"></div>
        <div id="search-list"></div>
      </section>

      <!-- Profil trader (halaman penuh) -->
      <section class="view" id="view-trader" aria-label="Profil trader">
        <div id="trader-profile"></div>
      </section>

      <!-- Dompet (struktur lengkap; fitur pembayaran nonaktif) -->
      <section class="view" id="view-wallet" aria-label="Dompet">
        <h1 data-i18n="walletTitle"></h1>
        <div id="wallet-body"></div>
      </section>

      <!-- Ruang Kerja -->
      <section class="view" id="view-office" aria-label="Ruang Kerja">
        <h1 data-i18n="officeTitle"></h1>
        <div id="office-body"></div>
      </section>

      <!-- Profil -->
      <section class="view" id="view-profile" aria-label="Profil">
        <h1 data-i18n="profileTitle"></h1>
        <div id="profile-body"></div>
      </section>

      <!-- Pengaturan (sub-halaman Profil; judul dirender sendiri) -->
      <section class="view" id="view-settings" aria-label="Pengaturan">
        <div id="settings-body"></div>
      </section>

      <!-- Bantuan & Panduan (sub-halaman Profil; Ronde 15 #3: gabungan) -->
      <section class="view" id="view-helpguide" aria-label="Bantuan dan Panduan">
        <div class="row">
          <button class="btn ghost" id="btn-helpguide-back" type="button"><span data-i18n="backProfile"></span></button>
        </div>
        <h1 data-i18n="helpGuideTitle"></h1>
        <p class="sub" data-i18n="helpGuideSub"></p>
        <div id="helpguide-tabs"></div>
        <div id="helpguide-guide"><div id="guide-sections"></div></div>
        <div id="helpguide-help" hidden><div id="help-body"></div></div>
      </section>
    </main>

    <!-- Panel kanan (Ronde 22): ringkasan akun — saldo + statistik nyata,
         tanpa "Trader Teratas" (dihapus atas persetujuan user). -->
    <aside class="right-panel" id="right-panel" aria-label="Ringkasan akun">
      <div class="rp-top">
        <div class="notif-wrap">
          <button class="bellbtn rp-bell" id="notif-bell" type="button" aria-label="Notifikasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bellbadge" id="notif-badge" hidden>0</span></button>
          <div class="notif-panel" id="notif-panel" hidden></div>
        </div>
        <button class="bellbtn rp-mode-btn" id="rp-mode-btn" type="button" data-mode="trader" aria-label="Ganti ke Akun Follower" title="Ganti ke Akun Follower"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></button>
        <button class="avatar-btn rp-avatar" id="rp-avatar" type="button" aria-label="Profil"></button>
      </div>
      <div id="rp-body"></div>
    </aside>

    <div class="bottom-nav">
      <nav aria-label="Navigasi utama">
        <button type="button" data-nav="home" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span><span data-i18n="navHome"></span></button>
        <button type="button" data-nav="search" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span><span data-i18n="navSearch"></span></button>
        <button type="button" data-nav="office" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span data-i18n="navOffice"></span></button>
        <button type="button" data-nav="wallet" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H6"/></svg></span><span data-i18n="navWallet"></span></button>
        <button type="button" data-nav="profile" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span data-i18n="navProfile"></span></button>
      </nav>
    </div>
  </div>

  <!-- Auth (tampil bila belum masuk) -->
  <div class="app auth-wrap" id="auth-view" hidden>
    <div class="logo" style="text-align:center; margin-bottom: 4px;">OLE <em>Signals</em></div>
    <p class="sub" style="text-align:center;" data-i18n="authWelcome"></p>
    <div class="auth-card">
      <div class="notice err" id="auth-error" hidden></div>
      <div class="notice" id="auth-notice" hidden></div>
      <form id="auth-form">
        <div class="field">
          <label for="auth-email" data-i18n="email"></label>
          <input id="auth-email" type="email" required autocomplete="email" placeholder="nama@email.com" />
        </div>
        <div class="field">
          <label for="auth-password" data-i18n="password"></label>
          <input id="auth-password" type="password" required autocomplete="current-password" />
          <div class="hint" id="password-hint" data-i18n="passwordHint"></div>
        </div>
        <div class="field" id="auth-confirm-field" hidden>
          <label for="auth-password-confirm" data-i18n="passwordConfirm"></label>
          <input id="auth-password-confirm" type="password" autocomplete="new-password" />
          <div class="hint" id="password-match-hint"></div>
        </div>
        <button class="btn primary" type="submit" id="auth-submit"></button>
      </form>
      <div class="row" style="justify-content:center; margin-top: 12px;">
        <button class="btn ghost" type="button" id="auth-toggle"></button>
      </div>
    </div>
    <p class="foot" data-i18n-html="riskWarn"></p>
  </div>

  <!-- Verifikasi kartu bagikan (/v/SM-...?code=...) -->
  <div class="app auth-wrap" id="verify-view" hidden></div>

  <!-- Overlay detail / konfirmasi -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="sheet" id="overlay-sheet"></div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="/js/qrcode.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
