<!doctype html>
<html lang="id" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="OLE Signals — marketplace sinyal forex. Trader memposting sinyal, follower menyalin manual di broker masing-masing." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230891B2'/%3E%3Cpath d='M7 21l6-7 4 4 8-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>OLE Signals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app" id="app" hidden>
    <header class="app-header">
      <div class="logo">OLE <em>Signals</em></div>
      <div class="tagline" data-i18n="appTagline"></div>
      <div class="notif-wrap">
        <button class="bellbtn" id="notif-bell" type="button" aria-label="Notifikasi">🔔<span class="bellbadge" id="notif-badge" hidden>0</span></button>
        <div class="notif-panel" id="notif-panel" hidden></div>
      </div>
    </header>

    <main>
      <!-- Beranda -->
      <section class="view" id="view-home" aria-label="Beranda">
        <header class="hero">
          <h1 data-i18n="heroH1"></h1>
          <p data-i18n="heroP"></p>
          <div class="flow" role="img" aria-label="PENDING → TERKUNCI → WIN / LOSS">
            <span class="fstep"><b>PENDING</b><i data-i18n="flowPendingSub"></i></span><span class="farr" aria-hidden="true">→</span>
            <span class="fstep"><b data-i18n="flowLocked"></b><i data-i18n="flowLockedSub"></i></span><span class="farr" aria-hidden="true">→</span>
            <span class="fstep win"><b>WIN / LOSS</b><i data-i18n="flowResultSub"></i></span>
          </div>
          <p class="lead-sm" data-i18n="heroLead"></p>
          <div class="hero-cta">
            <button class="btn primary" id="btn-hero-search" type="button"><span data-i18n="heroCtaSearch"></span></button>
          </div>
          <button class="guidelink" id="btn-hero-guide" type="button"><span data-i18n="guideCta"></span><span aria-hidden="true"> →</span></button>
        </header>
        <div class="row">
          <div>
            <h1 data-i18n="feedTitle"></h1>
            <p class="sub" data-i18n="appTagline"></p>
          </div>
          <div class="spacer"></div>
          <button class="btn ghost" id="btn-refresh-home" type="button">↻ <span data-i18n="refresh"></span></button>
        </div>
        <div id="home-filters"></div>
        <div id="home-list"></div>
        <section class="roadmap">
          <h2 data-i18n="roadTitle"></h2>
          <p data-i18n="roadSub"></p>
          <ul>
            <li><span class="tick" aria-hidden="true">✓</span><div><b data-i18n="road1T"></b><span data-i18n="road1D"></span></div></li>
            <li><span class="tick" aria-hidden="true">✓</span><div><b data-i18n="road2T"></b><span data-i18n="road2D"></span></div></li>
            <li><span class="tick" aria-hidden="true">✓</span><div><b data-i18n="road3T"></b><span data-i18n="road3D"></span></div></li>
            <li><span class="tick" aria-hidden="true">✓</span><div><b data-i18n="road4T"></b><span data-i18n="road4D"></span></div></li>
            <li><span class="tick" aria-hidden="true">✓</span><div><b data-i18n="road5T"></b><span data-i18n="road5D"></span></div></li>
            <li><span class="tick" aria-hidden="true">✓</span><div><b data-i18n="road6T"></b><span data-i18n="road6D"></span></div></li>
          </ul>
        </section>
        <p class="foot" data-i18n="riskWarn"></p>
      </section>

      <!-- Cari -->
      <section class="view" id="view-search" aria-label="Cari">
        <h1 data-i18n="searchTitle"></h1>
        <p class="sub" data-i18n="searchSub"></p>
        <div id="search-controls"></div>
        <div class="tabs" role="tablist" id="search-tabs">
          <button class="tab" role="tab" data-stab="traders" aria-selected="true"><span data-i18n="searchTabTraders"></span></button>
          <button class="tab" role="tab" data-stab="board" aria-selected="false"><span data-i18n="searchTabBoard"></span></button>
        </div>
        <div id="search-list"></div>
      </section>

      <!-- Ruang Kerja -->
      <section class="view" id="view-office" aria-label="Ruang Kerja">
        <h1 data-i18n="officeTitle"></h1>
        <div id="office-body"></div>
      </section>

      <!-- Profil -->
      <section class="view" id="view-profile" aria-label="Profil">
        <h1 data-i18n="profileTitle"></h1>
        <div id="profile-body"></div>
      </section>

      <!-- Pengaturan (sub-halaman Profil) -->
      <section class="view" id="view-settings" aria-label="Pengaturan">
        <div class="row">
          <button class="btn ghost" id="btn-settings-back" type="button">← <span data-i18n="back"></span></button>
        </div>
        <h1 data-i18n="settings"></h1>
        <div id="settings-body"></div>
      </section>

      <!-- Pusat Bantuan & Keamanan (sub-halaman Profil) -->
      <section class="view" id="view-help" aria-label="Bantuan">
        <div class="row">
          <button class="btn ghost" id="btn-help-back" type="button">← <span data-i18n="back"></span></button>
        </div>
        <h1 data-i18n="menuHelp"></h1>
        <p class="sub" data-i18n="helpSub"></p>
        <div id="help-body"></div>
      </section>

      <!-- Panduan -->
      <section class="view" id="view-guide" aria-label="Panduan">
        <div class="row">
          <button class="btn ghost" id="btn-guide-back" type="button">← <span data-i18n="back"></span></button>
        </div>
        <h1 data-i18n="guideTitle"></h1>
        <p class="sub" data-i18n="guideSub"></p>
        <div class="card">
          <h2 data-i18n="guideRules"></h2>
          <ol class="guide-list" id="guide-list"></ol>
        </div>
        <div id="guide-sections"></div>
        <p class="foot" data-i18n="riskWarn"></p>
      </section>
    </main>

    <div class="bottom-nav">
      <nav aria-label="Navigasi utama">
        <button type="button" data-nav="home" aria-selected="true"><span class="ic">⌂</span><span data-i18n="navHome"></span></button>
        <button type="button" data-nav="search" aria-selected="false"><span class="ic">⌕</span><span data-i18n="navSearch"></span></button>
        <button type="button" data-nav="office" aria-selected="false"><span class="ic">▣</span><span data-i18n="navOffice"></span></button>
        <button type="button" data-nav="profile" aria-selected="false"><span class="ic">◉</span><span data-i18n="navProfile"></span></button>
      </nav>
    </div>
  </div>

  <!-- Auth (tampil bila belum masuk) -->
  <div class="app auth-wrap" id="auth-view" hidden>
    <div class="logo" style="text-align:center; margin-bottom: 4px;">OLE <em>Signals</em></div>
    <p class="sub" style="text-align:center;" data-i18n="authWelcome"></p>
    <div class="auth-card">
      <div class="notice err" id="auth-error" hidden></div>
      <div class="notice" id="auth-notice" hidden></div>
      <form id="auth-form">
        <div class="field">
          <label for="auth-email" data-i18n="email"></label>
          <input id="auth-email" type="email" required autocomplete="email" placeholder="nama@email.com" />
        </div>
        <div class="field">
          <label for="auth-password" data-i18n="password"></label>
          <input id="auth-password" type="password" required autocomplete="current-password" />
          <div class="hint" id="password-hint" data-i18n="passwordHint"></div>
        </div>
        <div class="field" id="auth-confirm-field" hidden>
          <label for="auth-password-confirm" data-i18n="passwordConfirm"></label>
          <input id="auth-password-confirm" type="password" autocomplete="new-password" />
          <div class="hint" id="password-match-hint"></div>
        </div>
        <button class="btn primary" type="submit" id="auth-submit"></button>
      </form>
      <div class="row" style="justify-content:center; margin-top: 12px;">
        <button class="btn ghost" type="button" id="auth-toggle"></button>
      </div>
    </div>
    <p class="foot" data-i18n="riskWarn"></p>
  </div>

  <!-- Overlay detail / konfirmasi -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="sheet" id="overlay-sheet"></div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
